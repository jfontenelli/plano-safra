  <script>
/*
 * Janela modal reutilizável (fundo escurecido + caixa central).
 * Pode abrir um modal por cima de outro.
 * Fecha pela tecla Esc, clicando fora, em qualquer elemento com data-fechar
 * ou ao trocar de tela pelo menu. Enquanto aberto, o Tab fica preso dentro dele.
 * opcoes.devolverFoco: elemento que recebe o foco ao fechar (padrão: o que tinha o foco ao abrir).
 */
window.Modal = {
  abrir(html, opcoes = {}) {
    const fundo = document.createElement('div');
    fundo.className = 'modal-fundo';
    fundo.innerHTML = `<div class="modal ${opcoes.classe || ''}" role="dialog" aria-modal="true"
                            aria-labelledby="modal-titulo">${html}</div>`;

    const focoAnterior = opcoes.devolverFoco || document.activeElement;

    function fechar() {
      document.removeEventListener('keydown', aoTeclar);
      window.removeEventListener('hashchange', fechar);
      fundo.remove();
      if (focoAnterior && document.body.contains(focoAnterior)) focoAnterior.focus();
    }

    // Com um modal aberto por cima de outro, o Esc fecha só o de cima
    function aoTeclar(e) {
      const abertos = document.querySelectorAll('.modal-fundo');
      if (abertos[abertos.length - 1] !== fundo) return;
      if (e.key === 'Escape') fechar();
      if (e.key === 'Tab') prenderFoco(e);
    }

    // Tab no último elemento volta ao primeiro (e Shift+Tab no primeiro vai ao último)
    function prenderFoco(e) {
      const focaveis = [...fundo.querySelectorAll('button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])')]
        .filter((el) => !el.disabled && el.offsetParent !== null);
      if (!focaveis.length) return;
      const primeiro = focaveis[0];
      const ultimo = focaveis[focaveis.length - 1];
      if (!fundo.contains(document.activeElement)) { e.preventDefault(); primeiro.focus(); }
      else if (e.shiftKey && document.activeElement === primeiro) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primeiro.focus(); }
    }

    fundo.addEventListener('click', (e) => {
      if (e.target === fundo || e.target.closest('[data-fechar]')) fechar();
    });
    document.addEventListener('keydown', aoTeclar);
    window.addEventListener('hashchange', fechar);

    document.body.appendChild(fundo);
    return { elemento: fundo.firstElementChild, fechar };
  },

  /*
   * Pergunta com botões. botoes: [{ rotulo, classe ('primario' | 'secundario' | 'perigo'), acao }]
   * O primeiro botão "secundario" sem ação funciona como Cancelar.
   */
  confirmar({ titulo, texto, botoes }) {
    const modal = Modal.abrir(`
      <div class="modal__corpo">
        <button class="modal__fechar" type="button" aria-label="Fechar" data-fechar>${Icones.fechar}</button>
        <h2 class="modal__titulo" id="modal-titulo">${titulo}</h2>
        ${texto ? `<p class="modal__texto">${texto}</p>` : ''}
      </div>
      <div class="modal__rodape">
        ${botoes.map((b, i) => `<button class="botao botao--${b.classe || 'secundario'}" type="button" data-botao="${i}">${b.rotulo}</button>`).join('')}
      </div>
    `, { classe: 'modal--pequeno' });

    modal.elemento.addEventListener('click', (e) => {
      const b = e.target.closest('[data-botao]');
      if (!b) return;
      modal.fechar();
      const acao = botoes[b.dataset.botao].acao;
      if (acao) acao();
    });
    modal.elemento.querySelector('.modal__rodape .botao:last-child').focus();
    return modal;
  }
};

/*
 * Mensagem curta no rodapé da tela ("Recomendação aplicada em 11 talhões"),
 * com ação opcional (ex.: Desfazer). Some sozinha depois de alguns segundos.
 */
window.Aviso = {
  mostrar(texto, { acao, aoAgir } = {}) {
    document.querySelector('.aviso')?.remove();
    const aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.setAttribute('role', 'status');
    aviso.innerHTML = `<span>${texto}</span>${acao ? `<button class="aviso__acao" type="button">${acao}</button>` : ''}`;
    document.body.appendChild(aviso);
    const sumir = () => aviso.remove();
    const tempo = setTimeout(sumir, acao ? 7000 : 4000);
    aviso.querySelector('.aviso__acao')?.addEventListener('click', () => {
      clearTimeout(tempo); sumir(); aoAgir();
    });
  }
};

  <script>
/*
 * Estrutura de um plano e cálculos das operações.
 *
 * plano.grupos = [{ id, nome, tipo, operacoes: [operacao] }]
 * operacao     = { id, nome, dap, fenologia, receitas: [receita], talhoes: { 'T01': ajuste } }
 * receita      = { id, numero, nome, produtos: [linha] }
 *                Receita agronômica = conjunto de produtos + doses padrão. A composição de produtos
 *                determina a identidade da receita; a dose pode variar por talhão sem mudar a receita.
 * linha        = { id, principioAtivo, produto, unidade, dose, preCadastro }
 *                dose = dose padrão, sempre do produto comercial (princípio ativo só filtra o produto).
 * ajuste       = { receitaId, doses: { linhaId: dose } }
 *                Talhão presente em "talhoes" = recebe a operação, por uma receita só.
 *                Sem dose própria, o talhão segue a dose padrão da receita.
 *                O DAP é um só por operação (outro DAP = outra operação).
 */
window.Planos = (function () {
  let sequencia = 0;
  const novoId = (prefixo) => `${prefixo}${++sequencia}`;
  const vazio = (v) => v === null || v === undefined || v === '';

  function produtoDoCadastro(nome) {
    return DADOS.defensivos.find((d) => d.produto === nome);
  }

  function novaLinha(dados = {}) {
    return { id: novoId('l'), principioAtivo: '', produto: '', unidade: '', dose: null,
             preCadastro: false, ...dados };
  }

  function linhaDoProduto(nome, dose) {
    const d = produtoDoCadastro(nome);
    return novaLinha({ principioAtivo: d.principioAtivo || '', produto: d.produto || '', unidade: d.unidade,
                       dose, preCadastro: !!d.preCadastro });
  }

  // prazo: prazo para encerramento da OS, em dias (informado no Calendário Agrícola; null = padrão do grupo)
  function novaOperacao(nome, dap = null, prazo = null) {
    // Só no grupo Semente: plantio { 'T01': { variedade, data ('AAAA-MM-DD'), populacao (mil plantas/ha) } }
    // e germinação média do plano (%, um valor só para todos os talhões)
    return { id: novoId('o'), nome, dap, fenologia: '', prazo, receitas: [], talhoes: {}, plantio: {}, germinacao: null };
  }

  // ----- Receitas -----
  // Numeração automática: maior número já usado + 1 (renomear ou excluir não renumera)
  function proximoNumero(op) {
    return op.receitas.reduce((m, r) => Math.max(m, r.numero), 0) + 1;
  }

  // Nome padrão: "Recomendação 1"; no tratamento de sementes, "TSI 1"
  function novaReceita(op, produtos = [], base = 'Recomendação') {
    const numero = proximoNumero(op);
    return { id: novoId('r'), numero, nome: `${base} ${numero}`, produtos };
  }

  function novoAjuste(receitaId) {
    return { receitaId, doses: {} };
  }

  function novoGrupo(nome, tipo) {
    return { id: novoId('g'), nome, tipo, operacoes: [] };
  }

  // Grupos e operações do modelo, sem receitas e sem talhões
  function gruposModelo() {
    return DADOS.modeloOperacoes.map((g) => ({
      ...novoGrupo(g.nome, g.tipo),
      operacoes: g.operacoes.map((o) => ({ ...novaOperacao(o.nome, o.dap, o.prazo ?? null), fenologia: o.fenologia || '' }))
    }));
  }

  // Modelo preenchido com o detalhe dos planos de exemplo (ver dados-exemplo.js).
  // Os produtos de cada operação viram a Receita 1, aplicada nos talhões listados.
  function montarExemplo(detalhes) {
    const grupos = gruposModelo();
    grupos.forEach((g) => g.operacoes.forEach((op) => {
      const d = detalhes[op.nome];
      if (!d) return;
      if (d.fenologia) op.fenologia = d.fenologia; // senão, fica a do modelo
      if (d.dap !== undefined) op.dap = d.dap; // operação sem DAP no modelo (ex.: TSI)
      (d.plantio || []).forEach(({ talhao, variedade, data, populacao }) => { op.plantio[talhao] = { variedade, data, populacao }; });
      if (d.germinacao) op.germinacao = d.germinacao;
      // Tratamento de sementes (TSI): cada um vira "TSI N", nos talhões listados
      (d.tsi || []).forEach(({ produtos, talhoes }) => {
        const r = novaReceita(op, produtos.map(([nome, dose]) => linhaDoProduto(nome, dose)), 'TSI');
        op.receitas.push(r);
        talhoes.forEach((t) => { op.talhoes[t] = novoAjuste(r.id); });
      });
      if (!d.produtos || !d.produtos.length) return;
      const receita = novaReceita(op, d.produtos.map(([nome, dose]) => linhaDoProduto(nome, dose)));
      op.receitas.push(receita);
      (d.talhoes || []).forEach((t) => { op.talhoes[t] = novoAjuste(receita.id); });
      Object.entries(d.ajustes || {}).forEach(([talhao, aj]) => {
        const ajuste = op.talhoes[talhao];
        Object.entries(aj.doses || {}).forEach(([produto, dose]) => {
          ajuste.doses[receita.produtos.find((l) => l.produto === produto).id] = dose;
        });
      });
    }));
    return grupos;
  }

  // ----- Identidade: a composição de produtos -----
  // Linha ainda sem princípio ativo e sem produto (recém-adicionada) não conta
  function linhaPreenchida(linha) {
    return !!(linha.produto || linha.principioAtivo);
  }

  function chaveLinha(linha) {
    return Util.normalizar(linha.produto || linha.principioAtivo);
  }

  function composicao(produtos) {
    return [...new Set(produtos.filter(linhaPreenchida).map(chaveLinha))].sort().join('|');
  }

  function receitaDoTalhao(op, ajuste) {
    return ajuste ? op.receitas.find((r) => r.id === ajuste.receitaId) || null : null;
  }

  function talhoesDaReceita(op, receita) {
    return Object.keys(op.talhoes).filter((t) => op.talhoes[t].receitaId === receita.id);
  }

  // ----- Valores de cada talhão (o que é dele ou o que vem da receita) -----
  function linhasTalhao(op, ajuste) {
    const receita = receitaDoTalhao(op, ajuste);
    return receita ? receita.produtos.filter(linhaPreenchida) : [];
  }

  function doseTalhao(op, ajuste, linha) {
    return linha.id in ajuste.doses ? ajuste.doses[linha.id] : linha.dose;
  }

  function temAjuste(ajuste) {
    return Object.keys(ajuste.doses).length > 0;
  }

  // Completo: recebe a operação e cada produto tem dose. Sem dose: recebe, mas falta produto ou dose.
  // Sem operação: não recebe. Todo talhão da fazenda que não recebe a operação fica "Sem operação".
  function statusTalhao(op, nomeTalhao) {
    const ajuste = op.talhoes[nomeTalhao];
    if (!ajuste) return 'Sem operação';
    const linhas = linhasTalhao(op, ajuste);
    const completo = linhas.length > 0 &&
      linhas.every((l) => l.produto && !vazio(doseTalhao(op, ajuste, l)));
    return completo ? 'Completo' : 'Sem dose';
  }

  // Resumo da operação: área (ha) e número de talhões que recebem; quantos estão sem operação e sem dose
  function resumo(op, talhoesFazenda) {
    const recebem = talhoesFazenda.filter((t) => op.talhoes[t.nome]);
    return {
      area: recebem.reduce((s, t) => s + t.area, 0),
      talhoes: recebem.length,
      semOperacao: talhoesFazenda.length - recebem.length,
      semDose: recebem.filter((t) => statusTalhao(op, t.nome) === 'Sem dose').length
    };
  }

  // Colunas de dose da tabela de talhões: um produto por coluna, juntando as receitas já aplicadas
  // (receita sem talhões não aparece na tabela até ser aplicada)
  function colunasDose(op) {
    const vistas = new Set();
    const aplicadas = op.receitas.filter((r) => talhoesDaReceita(op, r).length);
    return aplicadas.flatMap((r) => r.produtos.filter(linhaPreenchida)).filter((l) => {
      const chave = chaveLinha(l);
      if (vistas.has(chave)) return false;
      vistas.add(chave);
      return true;
    });
  }

  // Linha da receita do talhão com o mesmo produto da coluna (ou null: o talhão não recebe)
  function linhaNoTalhao(op, ajuste, coluna) {
    return linhasTalhao(op, ajuste).find((l) => chaveLinha(l) === chaveLinha(coluna)) || null;
  }

  // "L/ha"; unidade do cadastro que já traz a base (TSI: "mL/100 kg") fica como está.
  // Sem produto comercial não há unidade (a dose é do produto).
  function unidadeDose(linha) {
    if (!linha.produto || !linha.unidade) return '';
    return linha.unidade.includes('/') ? linha.unidade : `${linha.unidade}/ha`;
  }

  function nomeLinha(linha) {
    return linha.produto || linha.principioAtivo || 'Produto';
  }

  return {
    novoId, novaLinha, linhaDoProduto, novaOperacao, novaReceita, novoAjuste, novoGrupo,
    gruposModelo, montarExemplo, produtoDoCadastro,
    linhaPreenchida, chaveLinha, composicao, receitaDoTalhao, talhoesDaReceita,
    linhasTalhao, doseTalhao, temAjuste, statusTalhao, resumo,
    colunasDose, linhaNoTalhao, unidadeDose, nomeLinha
  };
})();

</script>
  <script>
/*
 * Exportar e importar o plano em .xlsx (SheetJS, por CDN).
 * Na v1, o importar aceita só o arquivo exportado por este protótipo (aba "plano" com o formato abaixo).
 * Abas e colunas seguem a planilha de rascunho do cliente (plano_safra_piccini_rascunho.xlsx), sem custos:
 *   plano · operacoes · cultura_variedade · tratamento_sementes · corretivo_fertilizante · aplicacao_defensivo
 * Uma linha por talhão × operação × produto. A coluna "recomendacao" (Rec 1, TSI 2…) remonta as receitas.
 */
window.ArquivoPlano = (function () {
  const FORMATO = 'plano-safra-prototipo';
  const VERSAO = 1;
  const ABAS_REC = ['tratamento_sementes', 'corretivo_fertilizante', 'aplicacao_defensivo'];

  // ----- Exportar -----
  function nomeArquivo(plano) {
    const limpo = (t) => Util.normalizar(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return `plano-safra_${limpo(plano.safra)}_${limpo(plano.fazenda)}.xlsx`;
  }

  function abaDoGrupo(grupo) {
    if (grupo.tipo === 'Tratamento de sementes') return 'tratamento_sementes';
    if (grupo.tipo === 'Fertilidade') return 'corretivo_fertilizante';
    return 'aplicacao_defensivo';
  }

  function exportar(plano) {

      Aviso.mostrar('Não foi possível exportar: sem conexão com a internet para carregar o gerador de planilhas.');
      return;
    }
    const talhoes = DADOS.talhoes[plano.fazenda] || [];
    const area = (nome) => (talhoes.find((t) => t.nome === nome) || {}).area ?? null;
    const sementes = plano.grupos.find((g) => g.tipo === 'Sementes');
    const plantio = sementes && sementes.operacoes[0];

    const abaPlano = [
      ['campo', 'valor'],
      ['formato', FORMATO], ['versao', VERSAO],
      ['safra', plano.safra], ['empresa', plano.empresa], ['fazenda', plano.fazenda], ['cultura', plano.cultura],
      ['status', plano.status], ['germinacao_media', plantio && plantio.germinacao ? plantio.germinacao : ''],
      ['exportado_em', Util.hojeISO()], ['exportado_por', DADOS.usuario.nome]
    ];

    // previsao_cumprimento: prazo para encerramento da OS, em dias (vazio = padrão do grupo)
    const abaOperacoes = [['grupo_operacao', 'tipo_grupo', 'operacao', 'dap', 'fenologia', 'previsao_cumprimento']];
    plano.grupos.forEach((g) => {
      if (!g.operacoes.length) abaOperacoes.push([g.nome, g.tipo || '', '', '', '', '']);
      g.operacoes.forEach((op) => abaOperacoes.push([g.nome, g.tipo || '', op.nome, op.dap ?? '', op.fenologia || '', op.prazo ?? '']));
    });
    if (plantio && plantio.prazoColheita) abaPlano.push(['prazo_colheita', plantio.prazoColheita]);

    const abaVariedade = [['fazenda', 'talhao', 'area_talhao', 'cultura', 'grupo_operacao', 'operacao', 'variedade',
      'data_plantio', 'pop_plantas_planejada', 'pop_plantas_recomendada', 'perc_germinacao', 'quantidade_total_sementes', 'bags']];
    if (sementes) {
      sementes.operacoes.forEach((op) => {
        talhoes.forEach((t) => {
          const p = (op.plantio || {})[t.nome];
          if (!p) return;
          const v = p.variedade ? DADOS.variedades.find((x) => x.nome === p.variedade) : null;
          const sem = p.populacao && op.germinacao ? p.populacao * 1000 * t.area / (op.germinacao / 100) : null;
          abaVariedade.push([plano.fazenda, t.nome, t.area, plano.cultura, sementes.nome, op.nome, p.variedade || '',
            p.data || '', p.populacao || '', v && v.populacao ? `${v.populacao[0]}-${v.populacao[1]}` : '',
            op.germinacao || '', sem ? Math.round(sem) : '', sem ? Math.round(sem / 5e5) / 10 : '']);
        });
      });
    }

    const abasRec = {};
    ABAS_REC.forEach((nome) => {
      abasRec[nome] = [['fazenda', 'talhao', 'area_talhao', 'area_aplicacao', 'unidade_area', 'cultura', 'variedade',
        'grupo_operacao', 'operacao', 'fenologia', 'dap', 'recomendacao',
        nome === 'corretivo_fertilizante' ? 'materia_prima' : 'principio_ativo', 'nome_produto_comercial',
        'unidade_produto', 'dose_padrao', 'dose_ha', 'volume']];
    });
    plano.grupos.forEach((g) => {
      const aba = abasRec[abaDoGrupo(g)];
      g.operacoes.forEach((op) => {
        talhoes.forEach((t) => {
          const ajuste = op.talhoes[t.nome];
          if (!ajuste) return;
          const r = Planos.receitaDoTalhao(op, ajuste);
          if (!r) return;
          const variedade = ((op.plantio || {})[t.nome] || (plantio && plantio.plantio[t.nome]) || {}).variedade || '';
          r.produtos.filter(Planos.linhaPreenchida).forEach((l) => {
            const dose = Planos.doseTalhao(op, ajuste, l);
            aba.push([plano.fazenda, t.nome, t.area, t.area, 'ha', plano.cultura, variedade, g.nome, op.nome,
              op.fenologia || '', op.dap ?? '', r.nome, l.principioAtivo || '', l.produto || '', l.unidade || '',
              l.dose ?? '', dose ?? '', dose !== null && dose !== undefined ? Math.round(dose * t.area * 100) / 100 : '']);
          });
        });
      });
    });

    const livro = XLSX.utils.book_new();
    const anexar = (nome, linhas) => XLSX.utils.book_append_sheet(livro, XLSX.utils.aoa_to_sheet(linhas), nome);
    anexar('plano', abaPlano);
    anexar('operacoes', abaOperacoes);
    anexar('cultura_variedade', abaVariedade);
    ABAS_REC.forEach((nome) => anexar(nome, abasRec[nome]));
    XLSX.writeFile(livro, nomeArquivo(plano));
    Aviso.mostrar(`Plano exportado: ${nomeArquivo(plano)}`);
  }

  // ----- Importar -----
  // Lê o arquivo e devolve { contexto: { safra, empresa, fazenda, cultura }, abas } ou { erro }
  function ler(arquivo) {
    return new Promise((resolver) => {
      if (!window.XLSX) { resolver({ erro: 'Não foi possível ler o arquivo: sem conexão com a internet.' }); return; }
      const leitor = new FileReader();
      leitor.onerror = () => resolver({ erro: 'Não foi possível ler o arquivo.' });
      leitor.onload = () => {
        let livro;
        try { livro = XLSX.read(leitor.result, { type: 'array' }); } catch (e) { livro = null; }
        const naoEhDoSistema = { erro: 'Este arquivo não foi exportado pelo Plano de Safra. Na v1, só dá para importar um planejamento exportado por este sistema.' };
        if (!livro || !livro.Sheets.plano) { resolver(naoEhDoSistema); return; }
        const linhas = (nome) => (livro.Sheets[nome] ? XLSX.utils.sheet_to_json(livro.Sheets[nome], { defval: '' }) : []);
        const campos = Object.fromEntries(linhas('plano').map((x) => [x.campo, x.valor]));
        if (campos.formato !== FORMATO) { resolver(naoEhDoSistema); return; }
        resolver({
          contexto: { safra: String(campos.safra), empresa: String(campos.empresa), fazenda: String(campos.fazenda), cultura: String(campos.cultura) },
          germinacao: campos.germinacao_media === '' ? null : Number(campos.germinacao_media),
          prazoColheita: campos.prazo_colheita ? Number(campos.prazo_colheita) : null,
          abas: Object.fromEntries(['operacoes', 'cultura_variedade', ...ABAS_REC].map((n) => [n, linhas(n)]))
        });
      };
      leitor.readAsArrayBuffer(arquivo);
    });
  }

  // Talhões do arquivo que não existem na fazenda escolhida (ficam de fora)
  function talhoesFora(dados, fazenda) {
    const daFazenda = new Set((DADOS.talhoes[fazenda] || []).map((t) => t.nome));
    const doArquivo = new Set();
    ['cultura_variedade', ...ABAS_REC].forEach((n) => dados.abas[n].forEach((x) => x.talhao && doArquivo.add(String(x.talhao))));
    return [...doArquivo].filter((t) => !daFazenda.has(t)).sort();
  }

  // Monta os grupos do plano a partir do arquivo lido, para a fazenda escolhida
  function montarGrupos(dados, fazenda) {
    const daFazenda = new Set((DADOS.talhoes[fazenda] || []).map((t) => t.nome));
    const grupos = [];
    const acharOp = (grupo, operacao) => {
      const g = grupos.find((x) => x.nome === grupo);
      return g ? g.operacoes.find((o) => o.nome === operacao) : null;
    };
    dados.abas.operacoes.forEach((x) => {
      let g = grupos.find((y) => y.nome === x.grupo_operacao);
      if (!g) { g = Planos.novoGrupo(String(x.grupo_operacao), String(x.tipo_grupo || '')); grupos.push(g); }
      if (x.operacao === '') return;
      const op = Planos.novaOperacao(String(x.operacao), x.dap === '' ? null : Number(x.dap),
        x.previsao_cumprimento === '' || x.previsao_cumprimento === undefined ? null : Number(x.previsao_cumprimento));
      op.fenologia = String(x.fenologia || '');
      if (g.tipo === 'Sementes' && dados.germinacao) op.germinacao = dados.germinacao;
      if (g.tipo === 'Sementes' && dados.prazoColheita) op.prazoColheita = dados.prazoColheita;
      g.operacoes.push(op);
    });

    dados.abas.cultura_variedade.forEach((x) => {
      const op = acharOp(x.grupo_operacao, x.operacao);
      const talhao = String(x.talhao);
      if (!op || !daFazenda.has(talhao)) return;
      const variedade = String(x.variedade || '');
      if (variedade && !DADOS.variedades.some((v) => v.nome === variedade)) {
        DADOS.variedades.push({ cultura: String(x.cultura), nome: variedade, gm: null, ciclo: null, populacao: null, janela: null, preCadastro: true });
      }
      op.plantio[talhao] = { variedade, data: String(x.data_plantio || ''), ...(x.pop_plantas_planejada !== '' ? { populacao: Number(x.pop_plantas_planejada) } : {}) };
    });

    ABAS_REC.forEach((aba) => {
      dados.abas[aba].forEach((x) => {
        const op = acharOp(x.grupo_operacao, x.operacao);
        const talhao = String(x.talhao);
        if (!op || !daFazenda.has(talhao) || !x.nome_produto_comercial) return;
        const nome = String(x.recomendacao || 'Recomendação 1');
        let r = op.receitas.find((y) => y.nome === nome);
        if (!r) {
          const numero = Number((/(\d+)$/.exec(nome) || [])[1]) || op.receitas.length + 1;
          r = { id: Planos.novoId('r'), numero, nome, produtos: [] };
          op.receitas.push(r);
        }
        const produto = String(x.nome_produto_comercial);
        const pa = String(x.materia_prima ?? x.principio_ativo ?? '');
        let l = r.produtos.find((y) => y.produto === produto);
        if (!l) {
          const doCadastro = Planos.produtoDoCadastro(produto);
          if (!doCadastro) {
            DADOS.defensivos.push({ classe: '', produto, principioAtivo: pa, unidade: String(x.unidade_produto), preCadastro: true,
              ...(aba === 'tratamento_sementes' ? { tsi: true } : aba === 'corretivo_fertilizante' ? { fertilidade: true } : {}) });
          }
          l = Planos.novaLinha({ principioAtivo: pa, produto, unidade: String(x.unidade_produto),
            dose: x.dose_padrao === '' ? null : Number(x.dose_padrao), preCadastro: !doCadastro });
          r.produtos.push(l);
        }
        if (!op.talhoes[talhao]) op.talhoes[talhao] = Planos.novoAjuste(r.id);
        const dose = x.dose_ha === '' ? null : Number(x.dose_ha);
        if (dose !== l.dose) op.talhoes[talhao].doses[l.id] = dose;
      });
    });
    return grupos;
  }

  return { exportar, ler, talhoesFora, montarGrupos, nomeArquivo };
})();

/*

window.Telas.abrirModalCriarPlano = function ({ aoCriar }) {
  const INICIOS = [
    { valor: 'modelo',   titulo: 'Usar modelo',     icone: Icones.lista,
      texto: 'Use uma estrutura pronta de operações e ajuste conforme necessário.' },
    { valor: 'importar', titulo: 'Importar XLSX',   icone: Icones.planilha,
      texto: 'Continue um plano exportado por este sistema (.xlsx).' },
    { valor: 'clonar',   titulo: 'Clonar safra anterior', icone: Icones.copiar, emBreve: true,
      texto: 'Utilize o plano de uma safra anterior como base para o novo planejamento.' }
  ];

  const modal = Modal.abrir(`
    <form class="formulario" novalidate>
      <div class="modal__corpo">
        <button class="modal__fechar" type="button" aria-label="Fechar" data-fechar>${Icones.fechar}</button>

        <div class="campo">

          <select class="campo__controle" id="cp-safra" name="safra" required></select>
          ${erroObrigatorio('safra')}
          <div class="nova-safra" hidden>
            <input class="campo__controle" id="cp-nova-safra" type="text" placeholder="Nome da safra (ex.: 26/27)"
                   aria-label="Nome da nova safra" autocomplete="off">
            <button class="botao botao--primario" type="button" data-acao="adicionar-safra">Adicionar</button>
            <button class="botao botao--secundario" type="button" data-acao="cancelar-safra">Cancelar</button>
          </div>
        </div>

        ${campoLista('empresa', 'Empresa', 'Selecione uma empresa', DADOS.empresas)}
        ${campoLista('fazenda', 'Fazenda', 'Selecione uma fazenda', DADOS.fazendas)}
        <p class="campo__erro" id="cp-erro-duplicado" role="alert" hidden></p>
        ${campoLista('cultura', 'Cultura', 'Selecione uma cultura', DADOS.culturas)}

        <fieldset class="inicios">
          <legend class="inicios__pergunta">Como deseja iniciar o plano?</legend>
          <div class="inicios__grade">
            ${INICIOS.map(cardInicio).join('')}
          </div>
        </fieldset>

        <div class="importar" hidden>
          <label class="campo__rotulo" for="cp-arquivo">Arquivo exportado pelo Plano de Safra (.xlsx) ${asterisco()}</label>
          <input class="importar__arquivo" id="cp-arquivo" type="file" accept=".xlsx">
          <p class="erro-campo" id="cp-erro-arquivo" role="alert" hidden></p>
          <p class="importar__ok" id="cp-arquivo-ok" hidden></p>
          <div class="importar__diferencas" id="cp-diferencas" role="alert" hidden></div>
        </div>
      </div>

      <div class="modal__rodape">
        <p class="modal__rodape-erro" id="cp-erro-continuar" role="alert" hidden>
          Preencha os campos obrigatórios.</p>
        <button class="botao botao--secundario" type="button" data-fechar>Cancelar</button>
        <button class="botao botao--primario" type="submit" aria-disabled="true">Continuar para as operações</button>
      </div>
    </form>
  `, { classe: 'modal--formulario' });

  const form = modal.elemento.querySelector('form');
  const selectSafra = form.elements.safra;
  const caixaNovaSafra = form.querySelector('.nova-safra');
  const inputNovaSafra = form.querySelector('#cp-nova-safra');
  const NOVA_SAFRA = '__nova-safra__';
  let safraAnterior = '';
  const erroDuplicado = form.querySelector('#cp-erro-duplicado');
  const botaoContinuar = form.querySelector('[type="submit"]');
  const erroContinuar = form.querySelector('#cp-erro-continuar');
  const OBRIGATORIOS = ['safra', 'empresa', 'fazenda', 'cultura'];
  let tentouContinuar = false;  // os avisos de obrigatório só aparecem depois de tentar continuar

  preencherSafras();
  selectSafra.focus();

  // ----- Importar XLSX -----
  // Os campos do modal são conferidos com os do arquivo; se forem diferentes, a pessoa escolhe quais usar.
  const caixaImportar = form.querySelector('.importar');
  const inputArquivo = form.querySelector('#cp-arquivo');
  const erroArquivo = form.querySelector('#cp-erro-arquivo');
  const okArquivo = form.querySelector('#cp-arquivo-ok');
  const caixaDiferencas = form.querySelector('#cp-diferencas');
  const CAMPOS = [['safra', 'Safra'], ['empresa', 'Empresa'], ['fazenda', 'Fazenda'], ['cultura', 'Cultura']];
  let importado = null;      // arquivo lido: { contexto, germinacao, abas }
  let manterModal = false;   // a pessoa escolheu "Manter os do modal"

  function importando() { return form.elements.inicio.value === 'importar'; }

  function mostrarImportar() {
    caixaImportar.hidden = !importando();
    conferirArquivo();
  }

  inputArquivo.addEventListener('change', async () => {
    importado = null; manterModal = false;
    erroArquivo.hidden = true; okArquivo.hidden = true; caixaDiferencas.hidden = true;
    const arquivo = inputArquivo.files[0];
    if (!arquivo) return;
    const lido = await ArquivoPlano.ler(arquivo);
    if (lido.erro) { erroArquivo.textContent = lido.erro; erroArquivo.hidden = false; return; }
    importado = lido;
    const c = lido.contexto;
    okArquivo.textContent = `Planejamento da safra ${c.safra} · ${c.empresa} · Fazenda ${c.fazenda} · ${c.cultura}`;
    okArquivo.hidden = false;
    // Campos ainda vazios no modal recebem o valor do arquivo
    CAMPOS.forEach(([campo]) => { if (!form.elements[campo].value) escolher(campo, c[campo]); });
    conferirArquivo();
    atualizar();
  });

  // Coloca o valor na lista (se não existir, entra nela) e escolhe
  function escolher(campo, valor) {
    if (!valor) return;
    const select = form.elements[campo];
    if (campo === 'safra') {
      if (!DADOS.safras.includes(valor)) DADOS.safras.push(valor);
      preencherSafras(valor);
      return;
    }
    if (![...select.options].some((o) => o.value === valor)) select.add(new Option(valor, valor));
    select.value = valor;
  }

  function diferencas() {
    if (!importado || !importando()) return [];
    return CAMPOS.filter(([campo]) => form.elements[campo].value && form.elements[campo].value !== importado.contexto[campo]);
  }

  function conferirArquivo() {
    const lista = manterModal ? [] : diferencas();
    caixaDiferencas.hidden = !lista.length;
    if (!lista.length) { caixaDiferencas.innerHTML = ''; return; }
    const fora = form.elements.fazenda.value ? ArquivoPlano.talhoesFora(importado, form.elements.fazenda.value) : [];
    const esc = Util.escapar;
    caixaDiferencas.innerHTML = `
      <p class="importar__titulo">${Icones.alerta} O arquivo é de outro plano</p>
      <ul class="importar__lista">
        ${lista.map(([campo, rotulo]) => `<li>${rotulo}: no modal <strong>${esc(form.elements[campo].value)}</strong> · no arquivo <strong>${esc(importado.contexto[campo])}</strong></li>`).join('')}
      </ul>
      ${fora.length ? `<p class="importar__aviso">Mantendo os do modal, ${fora.length} ${fora.length === 1 ? 'talhão do arquivo não existe' : 'talhões do arquivo não existem'} na Fazenda ${esc(form.elements.fazenda.value)} e ${fora.length === 1 ? 'fica' : 'ficam'} de fora (${fora.map(esc).join(', ')}).</p>` : ''}
      <div class="importar__botoes">
        <button class="botao botao--secundario botao--p" type="button" data-acao="usar-arquivo">Usar os do arquivo</button>
        <button class="botao botao--secundario botao--p" type="button" data-acao="manter-modal">Manter os do modal</button>
      </div>`;
  }

  form.addEventListener('click', (e) => {
    const acao = e.target.closest('[data-acao]')?.dataset.acao;
    if (acao === 'usar-arquivo') {
      CAMPOS.forEach(([campo]) => escolher(campo, importado.contexto[campo]));
      conferirArquivo(); atualizar();
    }
    if (acao === 'manter-modal') { manterModal = true; conferirArquivo(); atualizar(); }
  });

  // ----- Criar nova safra (última opção da lista de safras) -----
  function preencherSafras(selecionada = '') {
    selectSafra.innerHTML = opcoes('Selecione uma safra', DADOS.safras, selecionada) +
      `<option value="${NOVA_SAFRA}">+ Criar nova safra</option>`;
    safraAnterior = selecionada;
  }

  // Escolher "+ Criar nova safra" volta a lista ao valor anterior e abre o campo do nome.
  // Registrado no próprio select, antes da validação do formulário.
  selectSafra.addEventListener('change', () => {
    if (selectSafra.value === NOVA_SAFRA) {
      selectSafra.value = safraAnterior;
      abrirNovaSafra();
    } else {
      safraAnterior = selectSafra.value;
    }
  });

  function abrirNovaSafra() {
    caixaNovaSafra.hidden = false;
    inputNovaSafra.value = '';
    inputNovaSafra.focus();
  }

  function fecharNovaSafra() {
    caixaNovaSafra.hidden = true;
  }

  function adicionarSafra() {
    const nome = inputNovaSafra.value.trim();
    if (!nome) { inputNovaSafra.focus(); return; }
    // Se o nome já existe, só seleciona a safra existente
    if (!DADOS.safras.includes(nome)) DADOS.safras.push(nome);
    preencherSafras(nome);
    fecharNovaSafra();
    selectSafra.focus();
    atualizar();
  }

  form.addEventListener('click', (e) => {
    const acao = e.target.closest('[data-acao]')?.dataset.acao;
    if (acao === 'adicionar-safra') adicionarSafra();
    if (acao === 'cancelar-safra') { fecharNovaSafra(); selectSafra.focus(); }
  });

  inputNovaSafra.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); adicionarSafra(); }
    if (e.key === 'Escape') { e.stopPropagation(); fecharNovaSafra(); selectSafra.focus(); }
  });

  // ----- Validação: quatro campos preenchidos e um plano por safra e fazenda -----
  function valores() {
    const f = form.elements;
    return {
      safra: f.safra.value,
      empresa: f.empresa.value,
      fazenda: f.fazenda.value,
      cultura: f.cultura.value,
      inicio: f.inicio.value
    };
  }

  function atualizar() {
    const v = valores();
    const duplicado = v.safra && v.fazenda &&
      DADOS.planos.some((p) => p.safra === v.safra && p.fazenda === v.fazenda);

    erroDuplicado.hidden = !duplicado;
    erroDuplicado.textContent = duplicado
      ? `Já existe um plano da safra ${v.safra} para a fazenda ${v.fazenda}.` // textContent: não precisa escapar
      : '';
    form.elements.fazenda.classList.toggle('campo__controle--erro', !!duplicado);

    const faltando = OBRIGATORIOS.filter((nome) => !v[nome]);
    // O botão parece desabilitado, mas continua clicável para explicar o que falta
    botaoContinuar.setAttribute('aria-disabled', faltando.length || duplicado ? 'true' : 'false');
    mostrarObrigatorios(tentouContinuar ? faltando : []);
    return { faltando, duplicado };
  }

  // "Preenchimento obrigatório" abaixo de cada campo vazio e a mensagem ao lado dos botões
  function mostrarObrigatorios(faltando) {
    OBRIGATORIOS.forEach((nome) => {
      const vazio = faltando.includes(nome);
      form.querySelector(`#cp-erro-${nome}`).hidden = !vazio;
      form.elements[nome].toggleAttribute('aria-invalid', vazio);
    });
    erroContinuar.hidden = !faltando.length;
  }

  form.addEventListener('change', (e) => {
    if (e.target.name === 'inicio') mostrarImportar();
    else if (e.target !== inputArquivo) { manterModal = false; conferirArquivo(); }
    atualizar();
  });

  // ----- Continuar para as operações -----
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    tentouContinuar = true;
    const { faltando, duplicado } = atualizar();
    if (faltando.length) { form.elements[faltando[0]].focus(); return; }
    if (duplicado) { form.elements.fazenda.focus(); return; }
    if (importando()) {
      // Importar: precisa do arquivo lido e, se houver diferença, da escolha da pessoa
      if (!importado) {
        if (erroArquivo.hidden) { erroArquivo.textContent = 'Escolha o arquivo exportado pelo Plano de Safra.'; erroArquivo.hidden = false; }
        inputArquivo.focus(); return;
      }
      if (!caixaDiferencas.hidden) { caixaDiferencas.querySelector('button').focus(); return; }
    }
    const v = valores();
    modal.fechar();
    aoCriar({
      safra: v.safra,
      empresa: v.empresa,
      fazenda: v.fazenda,
      cultura: v.cultura,
      inicio: v.inicio,
      ...(importando() ? { importado } : {})
    });
  });

  // ----- Pedaços de HTML -----
  // Com uma opção só (ex.: cultura, por enquanto só Soja), ela já vem escolhida
  function campoLista(nome, rotulo, textoVazio, itens) {
    return `
      <div class="campo">
        <label class="campo__rotulo" for="cp-${nome}">${rotulo} ${asterisco()}</label>
        <select class="campo__controle" id="cp-${nome}" name="${nome}" required>
          ${opcoes(textoVazio, itens, itens.length === 1 ? itens[0] : '')}
        </select>
        ${erroObrigatorio(nome)}
      </div>
    `;
  }

  function asterisco() {
    return '<span class="obrigatorio" aria-hidden="true">*</span>';
  }

  function erroObrigatorio(nome) {
    return `<p class="erro-campo" id="cp-erro-${nome}" hidden>Preenchimento obrigatório</p>`;
  }

  function opcoes(textoVazio, itens, selecionado = '') {
    return `<option value="" disabled ${selecionado ? '' : 'selected'}>${textoVazio}</option>` +
      itens.map((item) =>
        `<option value="${Util.escapar(item)}" ${item === selecionado ? 'selected' : ''}>${Util.escapar(item)}</option>`).join('');
  }

  function cardInicio(c) {
    return `
      <label class="card-inicio ${c.emBreve ? 'card-inicio--desabilitado' : ''}">
        <input class="card-inicio__radio" type="radio" name="inicio" value="${c.valor}"
               ${c.valor === 'modelo' ? 'checked' : ''} ${c.emBreve ? 'disabled' : ''}>
        <span class="card-inicio__icone">${c.icone}</span>
        <span class="card-inicio__textos">
          <span class="card-inicio__titulo">
            ${c.titulo}
            ${c.emBreve ? '<span class="selo">Em breve</span>' : ''}
          </span>
          <span class="card-inicio__texto">${c.texto}</span>
        </span>
      </label>
    `;
  }
};

</script>
  <script>
/*
 * Tela 03 — Lista de planos (docs/telas/03-lista-planos.md)
 * Aparece no menu "Plano de Safra" quando existe ao menos um plano.
 */
window.Telas = window.Telas || {};

window.Telas.listaPlanos = (function () {
  const esc = Util.escapar;

  // Filtros: Safra começa na mais recente cadastrada; os demais em "Todas" ('')
  let filtros = {};

  function desenhar() {
    filtros = { safra: Util.safraMaisRecente(DADOS.safras), empresa: '', fazenda: '', cultura: '' };

    return `
      <header class="cabecalho">
        <h1 class="cabecalho__titulo">Plano de Safra</h1>
        <button class="botao botao--primario" type="button" data-acao="criar-plano">
          ${Icones.mais} Criar Plano Safra
        </button>
      </header>

      <div class="pagina">
        <section class="cartao filtros" aria-labelledby="titulo-filtros">
          <h2 class="secao__titulo" id="titulo-filtros">Filtrar planos</h2>
          <div class="filtros__grade">
            ${filtro('safra', 'Safra', DADOS.safras)}
            ${filtro('empresa', 'Empresa', DADOS.empresas)}
            ${filtro('fazenda', 'Fazenda', DADOS.fazendas)}
            ${filtro('cultura', 'Cultura', DADOS.culturas)}
          </div>
        </section>

        <section aria-labelledby="titulo-visao-geral">
          <h2 class="secao__titulo" id="titulo-visao-geral">Visão geral</h2>
          <div class="indicadores" id="lp-indicadores"></div>
        </section>

        <section aria-labelledby="titulo-planos">
          <h2 class="secao__titulo" id="titulo-planos">Planos de Safra</h2>
          <div class="cartao tabela-rolagem">
            <table class="tabela">
              <thead>
                <tr>
                  <th class="lista-planos__menu"><span class="so-leitor">Mais ações</span></th>
                  <th>Safra</th><th>Empresa</th><th>Fazenda</th><th>Cultura</th>
                  <th class="tabela__numero">Área</th>
                  <th class="tabela__numero">Custo estimado</th>
                  <th class="tabela__numero">Receita projetada</th>
                  <th>Status</th><th>Última atualização</th><th>Atualizado por</th>
                  <th><span class="so-leitor">Abrir</span></th>
                </tr>
              </thead>
              <tbody id="lp-linhas"></tbody>
            </table>
          </div>
        </section>
      </div>
    `;
  }

  // Depois que o HTML está na página: liga os filtros e desenha números e lista
  function aoMostrar(conteudo) {
    conteudo.querySelectorAll('[data-filtro]').forEach((select) => {
      select.addEventListener('change', () => {
        filtros[select.dataset.filtro] = select.value;
        atualizar(conteudo);
      });
    });
    atualizar(conteudo);
    // Menu do plano: botão direito na linha ou o botão ⋯ no começo da linha (Excluir · Exportar · Abrir)
    conteudo.addEventListener('contextmenu', (e) => {
      const tr = e.target.closest('tr[data-plano]');
      if (!tr || e.target.closest('a, button')) return;
      e.preventDefault();
      abrirMenuPlano(Number(tr.dataset.plano), e.target, e.clientX, e.clientY);
    });
    conteudo.addEventListener('click', (e) => {
      const botao = e.target.closest('[data-menu-plano]');
      if (!botao) return;
      const caixa = botao.getBoundingClientRect();
      abrirMenuPlano(Number(botao.dataset.menuPlano), botao, caixa.left, caixa.bottom + 4);
    });
  }

  // ----- Menu do plano -----
  let menuAberto = null;
  function abrirMenuPlano(id, ancora, x, y) {
    fecharMenuPlano();
    const p = DADOS.planos.find((x) => x.id === id);
    if (!p) return;
    const menu = document.createElement('div');
    menu.className = 'menu-contexto';
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', `Plano ${p.safra} · ${p.fazenda}`);
    // Excluir só para plano em construção; no aprovado aparece desabilitado, com o motivo
    const aprovado = p.status === 'Aprovado';
    menu.innerHTML = [['excluir', 'Excluir'], ['exportar', 'Exportar (.xlsx)'], ['abrir', 'Abrir']]
      .map(([item, rotulo]) => {
        const bloqueado = item === 'excluir' && aprovado;
        return `<button class="menu-contexto__item ${item === 'excluir' ? 'menu-contexto__item--perigo' : ''}" type="button" role="menuitem" data-item="${item}"
                  ${bloqueado ? 'aria-disabled="true" title="Plano aprovado não pode ser excluído"' : ''}>${rotulo}${bloqueado
                  ? '<span class="menu-contexto__motivo">Plano aprovado não pode ser excluído</span>' : ''}</button>`;
      }).join('');
    document.body.appendChild(menu);
    const { width, height } = menu.getBoundingClientRect();
    menu.style.left = `${Math.max(8, Math.min(x, window.innerWidth - width - 8))}px`;
    menu.style.top = `${y + height + 8 > window.innerHeight ? Math.max(8, y - height) : y}px`;
    const itens = [...menu.querySelectorAll('[data-item]')];
    const fora = (ev) => { if (!menu.contains(ev.target)) fecharMenuPlano(); };
    menu.addEventListener('click', (ev) => {
      const item = ev.target.closest('[data-item]');
      if (!item || item.getAttribute('aria-disabled') === 'true') return;
      fecharMenuPlano();
      if (item.dataset.item === 'abrir') location.hash = `#/plano/${p.id}`;
      else if (item.dataset.item === 'exportar') ArquivoPlano.exportar(p);
      else excluirPlano(p);
    });
    menu.addEventListener('keydown', (ev) => {
      const i = itens.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); itens[(i + 1) % itens.length].focus(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); itens[(i - 1 + itens.length) % itens.length].focus(); }
      else if (ev.key === 'Escape' || ev.key === 'Tab') { ev.preventDefault(); fecharMenuPlano(); if (ancora.isConnected) ancora.focus(); }
    });
    document.addEventListener('mousedown', fora, true);
    menuAberto = { menu, fora };
    itens[0].focus();
  }

  // Excluir plano (só em construção): confirmação; sem nenhum plano, volta ao primeiro uso (Tela 01)
  function excluirPlano(p) {
    Modal.confirmar({
      titulo: 'Excluir plano?',
      texto: `<strong>${esc(p.cultura)} · Safra ${esc(p.safra)} · Fazenda ${esc(p.fazenda)}</strong><br>
              As operações, recomendações e talhões planejados desse plano serão apagados. Essa ação não pode ser desfeita.`,
      botoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Excluir plano', classe: 'perigo', acao: () => {
        DADOS.planos.splice(DADOS.planos.indexOf(p), 1);
        window.dispatchEvent(new HashChangeEvent('hashchange')); // redesenha a tela (lista ou primeiro uso)
        Aviso.mostrar('Plano excluído');
      } }]
    });
  }

  function fecharMenuPlano() {
    if (!menuAberto) return;
    document.removeEventListener('mousedown', menuAberto.fora, true);
    menuAberto.menu.remove();
    menuAberto = null;
  }

  function planosFiltrados() {
    return DADOS.planos.filter((p) =>
      ['safra', 'empresa', 'fazenda', 'cultura'].every((campo) => !filtros[campo] || p[campo] === filtros[campo]));
  }

  function atualizar(conteudo) {
    const planos = planosFiltrados();
    conteudo.querySelector('#lp-indicadores').innerHTML = indicadores(planos);
    conteudo.querySelector('#lp-linhas').innerHTML = planos.length
      ? planos.map(linha).join('')
      : `<tr><td class="tabela__vazia" colspan="12">Nenhum plano encontrado com esses filtros.</td></tr>`;
  }

  // ----- Indicadores, sempre calculados sobre os planos filtrados -----
  function indicadores(planos) {
    const area = planos.reduce((soma, p) => soma + Util.areaPlano(p), 0);
    const comCusto = planos.filter((p) => p.custo !== null && p.custo !== undefined);
    const comReceita = planos.filter((p) => p.receita !== null && p.receita !== undefined);
    const soma = (lista, campo) => lista.reduce((s, p) => s + p[campo], 0);

    return `
      ${indicador('area', Icones.broto, 'Área planejada', Util.area(area),
        `${planos.length} ${planos.length === 1 ? 'plano cadastrado' : 'planos cadastrados'}`)}
      ${indicador('custo', Icones.moedas, 'Custo estimado',
        comCusto.length ? Util.reaisResumido(soma(comCusto, 'custo')) : '—',
        comCusto.length ? planosComValor(comCusto.length, planos.length) : 'Aguardando orçamento')}
      ${indicador('receita', Icones.grafico, 'Receita projetada',
        comReceita.length ? Util.reaisResumido(soma(comReceita, 'receita')) : '—',
        comReceita.length ? planosComValor(comReceita.length, planos.length) : 'Aguardando premissas de produção')}
    `;
  }

  // Quando só parte dos planos tem valor, avisa quantos entraram na soma
  function planosComValor(com, total) {
    return com === total ? `Soma de ${total} ${total === 1 ? 'plano' : 'planos'}` : `Soma de ${com} de ${total} planos`;
  }

  function indicador(tipo, icone, titulo, valor, dica) {
    return `
      <div class="cartao indicador indicador--${tipo}">
        <span class="indicador__icone">${icone}</span>
        <div>
          <p class="indicador__titulo">${titulo}</p>
          <p class="indicador__valor">${valor}</p>
          <p class="indicador__dica">${dica}</p>
        </div>
      </div>
    `;
  }

  // ----- Lista -----
  function linha(p) {
    const aprovado = p.status === 'Aprovado';
    return `
      <tr data-plano="${p.id}">
        <td class="lista-planos__menu">
          <button class="botao-icone" type="button" data-menu-plano="${p.id}" title="Mais ações"
                  aria-haspopup="menu" aria-label="Mais ações do plano ${esc(p.safra)} · ${esc(p.fazenda)}">${Icones.mais_opcoes}</button>
        </td>
        <td>${esc(p.safra)}</td>
        <td>${esc(p.empresa)}</td>
        <td>${esc(p.fazenda)}</td>
        <td>${esc(p.cultura)}</td>
        <td class="tabela__numero">${Util.area(Util.areaPlano(p))}</td>
        <td class="tabela__numero">${Util.reaisResumido(p.custo)}</td>
        <td class="tabela__numero">${Util.reaisResumido(p.receita)}</td>
        <td><span class="status ${aprovado ? 'status--aprovado' : 'status--construcao'}">${p.status}</span></td>
        <td>${Util.data(p.atualizadoEm)}</td>
        <td>${esc(p.atualizadoPor)}</td>
        <td class="tabela__acao">
          <a class="botao-icone" href="#/plano/${p.id}" title="Abrir plano"
             aria-label="Abrir plano ${esc(p.safra)} · ${esc(p.fazenda)}">${Icones.seta}</a>
        </td>
      </tr>
    `;
  }

  function filtro(nome, rotulo, itens) {
    return `
      <div class="campo">
        <label class="campo__rotulo" for="lp-${nome}">${rotulo}</label>
        <select class="campo__controle" id="lp-${nome}" data-filtro="${nome}">
          <option value="">Todas</option>
          ${itens.map((item) => `<option value="${esc(item)}" ${item === filtros[nome] ? 'selected' : ''}>${esc(item)}</option>`).join('')}
        </select>
      </div>
    `;
  }

  return { desenhar, aoMostrar };
})();

</script>
  <script>
/*
 * Tela 05 — Calendário Agrícola (docs/telas/05-calendario-agricola.md)
 * Etapa do plano que junta todos os grupos (Semente, Defensivo, Fertilidade…) em ordem de DAP.
 * Duas visões: Infográfico (uma coluna por fase da cultura) e Tabela (uma linha por operação,
 * uma coluna por produto). Filtro por talhão. Na Tabela se informa o prazo para encerramento da OS.
 * Desenhada dentro da Tela 04 (mesmo cabeçalho do plano); a Tela 04 repassa os eventos para cá.
 */
window.Telas = window.Telas || {};

window.Telas.calendario = (function () {
  const esc = Util.escapar;
  const PRAZO_COLHEITA = 10;

  // ----- Prazo para encerramento da OS (dias): o da operação ou o padrão do tipo do grupo -----
  function prazoDe(op, grupo) {
    if (op.prazo !== null && op.prazo !== undefined) return op.prazo;
    return grupo.tipo === 'Sementes' ? 3 : grupo.tipo === 'Colheita' ? PRAZO_COLHEITA : 2;
  }

  // Pré-plantio (DAP negativo), Plantio (DAP 0) e Colheita não têm fenologia
  function fenologiaDe(op) {
    if (op.dap === null || op.dap === undefined || op.dap === '') return '';
    if (op.dap <= 0) return '';
    return op.fenologia || '';
  }

  function variedade(nome) {
    return DADOS.variedades.find((v) => v.nome === nome) || null;
  }

  // Dose: duas casas nos defensivos e no TSI; sem casas fixas na Fertilidade
  function textoDose(valor, grupo) {
    if (valor === null || valor === undefined) return '—';
    return grupo.tipo === 'Fertilidade' ? valor.toLocaleString('pt-BR', { maximumFractionDigits: 3 }) : Util.dose(valor);
  }

  // ----- Itens do calendário: uma operação de qualquer grupo, ou a colheita (prevista pelo plantio) -----
  function itens(ctx) {
    const { plano, talhoes, estado } = ctx;
    const filtro = (nome) => estado.talhao === 'todos' || estado.talhao === nome;
    const daFazenda = talhoes.filter((t) => filtro(t.nome));
    const area = (nomes) => daFazenda.filter((t) => nomes.includes(t.nome)).reduce((s, t) => s + t.area, 0);
    const lista = [];
    let plantio = null;
    // Grupo Colheita: não entra como operação; a colheita vem do plantio (abaixo) e usa o nome e a previsão de conclusão dele
    const gColheita = plano.grupos.find((g) => g.tipo === 'Colheita');
    const opColheita = gColheita ? gColheita.operacoes[0] : null;
    plano.grupos.filter((g) => g.tipo !== 'Colheita').forEach((grupo) => {
      grupo.operacoes.forEach((op) => {
        const semente = grupo.tipo === 'Sementes';
        if (semente && !plantio) plantio = op;
        const recebem = daFazenda.map((t) => t.nome).filter((t) =>
          semente ? !!((op.plantio || {})[t] && op.plantio[t].variedade) : !!op.talhoes[t]);
        // Produtos: um por produto comercial, com a dose de cada talhão (receitas da operação; no grupo Tratamento de semente, as TSI)
        const produtos = new Map();
        daFazenda.forEach((t) => {
          const ajuste = op.talhoes[t.nome];
          if (!ajuste) return;
          Planos.linhasTalhao(op, ajuste).forEach((l) => {
            const chave = Planos.chaveLinha(l);
            if (!produtos.has(chave)) produtos.set(chave, { nome: Planos.nomeLinha(l), unidade: Planos.unidadeDose(l), doses: [] });
            produtos.get(chave).doses.push({ talhao: t.nome, dose: Planos.doseTalhao(op, ajuste, l) });
          });
        });
        const variedades = semente ? new Set(recebem.map((t) => op.plantio[t].variedade)) : null;
        lista.push({ grupo, op, dap: op.dap, fenologia: fenologiaDe(op), prazo: prazoDe(op, grupo),
          talhoes: recebem, area: area(recebem), produtos: [...produtos.entries()], variedades });
      });
    });
    // Colheita: talhões com variedade, data de plantio e ciclo; o DAP é o ciclo da variedade
    // Colheita: sempre a última coluna. Com plantio (variedade, data e ciclo), o DAP é o ciclo da variedade;
    // antes disso, aparece "Aguardando plantio" (o DAP é pelo ciclo, só existe depois do plantio)
    const comPrevisao = plantio ? daFazenda.filter((t) => {
      const p = (plantio.plantio || {})[t.nome];
      const v = p && p.variedade ? variedade(p.variedade) : null;
      return p && p.data && v && v.ciclo;
    }).map((t) => t.nome) : [];
    const prazoColheita = opColheita ? prazoDe(opColheita, gColheita) : (plantio && plantio.prazoColheita) ?? PRAZO_COLHEITA;
    if (!comPrevisao.length) {
      lista.push({ colheita: true, aguardando: true, grupo: gColheita || { nome: 'Colheita', tipo: 'Colheita' }, op: opColheita || plantio,
        dap: null, fenologia: '', prazo: prazoColheita, talhoes: [], area: 0, produtos: [], variedades: null });
    }
    {
      if (comPrevisao.length) {
        const ciclos = comPrevisao.map((t) => variedade(plantio.plantio[t].variedade).ciclo);
        lista.push({ colheita: true, grupo: gColheita || { nome: 'Colheita', tipo: 'Colheita' }, op: opColheita || plantio,
          dap: Math.min(...ciclos), dapMax: Math.max(...ciclos), fenologia: '',
          prazo: prazoColheita, talhoes: comPrevisao, area: area(comPrevisao), produtos: [],
          variedades: new Set(comPrevisao.map((t) => plantio.plantio[t].variedade)) });
      }
    }
    const ordemGrupo = (i) => plano.grupos.indexOf(i.grupo);
    return lista.sort((a, b) => (a.colheita - b.colheita) || ((a.dap ?? 9999) - (b.dap ?? 9999)) || (ordemGrupo(a) - ordemGrupo(b)));
  }

  // "0,40 L/ha"; doses diferentes entre talhões: "130 a 160 kg/ha", com o detalhe ao passar o mouse
  function dose(produto, grupo) {
    const valores = [...new Set(produto.doses.map((d) => d.dose))].filter((d) => d !== null && d !== undefined).sort((a, b) => a - b);
    const u = produto.unidade ? ` ${produto.unidade}` : '';
    if (!valores.length) return { texto: '—', detalhe: '' };
    if (valores.length === 1) return { texto: `${textoDose(valores[0], grupo)}${u}`, detalhe: '' };
    const detalhe = valores.map((v) => {
      const ts = produto.doses.filter((d) => d.dose === v).map((d) => d.talhao);
      return `${textoDose(v, grupo)}${u} ${ts.length <= 3 ? `no${ts.length > 1 ? 's' : ''} ${ts.join(', ')}` : `em ${ts.length} talhões`}`;
    }).join(' · ');
    return { texto: `${textoDose(valores[0], grupo)} a ${textoDose(valores[valores.length - 1], grupo)}${u}`, detalhe };
  }

  // ----- Fases (colunas do infográfico) -----
  const ORDEM_FEN = () => DADOS.fenologia;
  function faseDe(item) {
    if (item.colheita) return 'colheita';
    if (item.dap === null || item.dap === undefined || item.dap === '') return 'sem-dap';
    if (item.dap < 0) return 'pre';
    if (item.dap === 0) return 'plantio';
    return item.fenologia ? `fen:${item.fenologia}` : `dap:${item.dap}`;
  }

  // Cor do título e imagem de cada fase.
  // Sem fenologia ou sem DAP: imagem neutra (calendário).
  function visualDe(chave) {
    if (chave === 'pre') return { cor: '#6f5b12', imagem: IMAGENS.pre };
    if (chave === 'plantio') return { cor: '#2e7d32', imagem: IMAGENS.plantio };
    if (chave === 'colheita') return { cor: '#23395d', imagem: IMAGENS.colheita };
    if (chave.startsWith('fen:')) {
      const f = chave.slice(4);
      const imagem = IMAGENS[f] || IMAGENS.neutro;
      if (/^V|^VE|^VC/.test(f)) return { cor: '#0f7f74', imagem };
      if (f === 'R1' || f === 'R2') return { cor: '#1b7a8c', imagem };
      if (f === 'R3' || f === 'R4') return { cor: '#2a64a8', imagem };
      if (f === 'R5' || f === 'R6') return { cor: '#1d5a6b', imagem };
      return { cor: '#5a5520', imagem };
    }
    return { cor: '#6b7280', imagem: IMAGENS.neutro };
  }

  function colunas(lista) {
    const mapa = new Map();
    lista.forEach((item) => {
      const chave = faseDe(item);
      if (!mapa.has(chave)) mapa.set(chave, { chave, itens: [], daps: [] });
      const c = mapa.get(chave);
      c.itens.push(item);
      if (item.dap !== null && item.dap !== undefined && item.dap !== '') c.daps.push(item.dap, item.dapMax ?? item.dap);
    });
    const peso = (c) => (c.chave === 'colheita' ? 1e6 : c.chave === 'sem-dap' ? 2e6 : Math.min(...c.daps));
    return [...mapa.values()].sort((a, b) => peso(a) - peso(b) ||
      ORDEM_FEN().indexOf(a.chave.slice(4)) - ORDEM_FEN().indexOf(b.chave.slice(4)));
  }

  function tituloColuna(c) {
    const min = Math.min(...c.daps); const max = Math.max(...c.daps);
    const faixa = c.daps.length ? (min === max ? `${min} DAP` : `${min} a ${max} DAP`) : '';
    if (c.chave === 'pre') return ['Pré-plantio', faixa];
    if (c.chave === 'plantio') return ['Plantio', faixa];
    if (c.chave === 'colheita') return ['Colheita', faixa || 'pelo ciclo da variedade'];
    if (c.chave === 'sem-dap') return ['Sem DAP', ''];
    if (c.chave.startsWith('fen:')) return [c.chave.slice(4), faixa];
    return [faixa, 'sem fenologia'];
  }

  // ----- Desenho -----
  function desenhar(ctx) {
    const { talhoes, estado } = ctx;
    const lista = itens(ctx);
    const total = estado.talhao === 'todos' ? talhoes.length : 1;
    return `
      <section class="calendario">
        <div class="calendario__barra">
          <label class="calendario__filtro">
            <span class="calendario__filtro-rotulo">Talhão</span>
            <select class="campo__controle" data-campo="cal-talhao" aria-label="Talhão">
              <option value="todos" ${estado.talhao === 'todos' ? 'selected' : ''}>Todos os talhões</option>
              ${talhoes.map((t) => `<option value="${esc(t.nome)}" ${estado.talhao === t.nome ? 'selected' : ''}>${esc(t.nome)} · ${Util.area(t.area)}</option>`).join('')}
            </select>
          </label>
          <div class="visoes calendario__visoes" role="group" aria-label="Visão do calendário">
            ${[['infografico', Icones.grafico, 'Infográfico'], ['tabela', Icones.lista, 'Tabela']].map(([v, icone, rotulo]) => `
              <button class="visoes__botao ${estado.visao === v ? 'visoes__botao--ativo' : ''}" type="button" data-acao="cal-visao"
                      data-visao="${v}" aria-pressed="${estado.visao === v}">${icone}${rotulo}</button>`).join('')}
          </div>
        </div>
        ${!lista.length ? '<p class="calendario__vazio">Nenhuma operação no plano.</p>'
          : estado.visao === 'tabela' ? tabela(ctx, lista, total) : infografico(ctx, lista)}
      </section>`;
  }

  function etiqueta(grupo) {
    const tipo = Util.normalizar(grupo.tipo || 'outro').replace(/\s+/g, '-');
    return `<span class="cal-etiqueta cal-etiqueta--${tipo}">${esc(grupo.nome)}</span>`;
  }

  function cartao(item) {
    const n = item.variedades ? item.variedades.size : 0;
    const extra = item.aguardando ? '<p class="cal-cartao__sem">Aguardando plantio: a data vem do plantio + ciclo da variedade</p>'
      : item.variedades ? `<p class="cal-cartao__sub">${n ? `${n} ${n === 1 ? 'variedade' : 'variedades'}` : 'Sem variedade'}</p>` : '';
    const produtos = item.produtos.length ? `
      <ul class="cal-cartao__produtos">
        ${item.produtos.map(([, p]) => {
          const d = dose(p, item.grupo);
          return `<li><span class="cal-cartao__produto">${esc(p.nome)}</span><span class="cal-cartao__dose" ${d.detalhe ? `title="${esc(d.detalhe)}"` : ''}>${esc(d.texto)}</span></li>`;
        }).join('')}
      </ul>` : (!item.variedades && !item.colheita ? '<p class="cal-cartao__sem">Sem recomendação</p>' : '');
    return `
      <article class="cal-cartao">
        ${etiqueta(item.grupo)}
        <h4 class="cal-cartao__nome">${esc(item.colheita ? 'Colheita' : item.op.nome)}</h4>
        ${extra}${produtos}
      </article>`;
  }

  function infografico(ctx, lista) {
    const cols = colunas(lista);
    return `
      <div class="cal-info" role="list" aria-label="Calendário por fase da cultura">
        ${cols.map((c, i) => {
          const { cor, imagem } = visualDe(c.chave);
          const [titulo, sub] = tituloColuna(c);
          const talhoes = new Set(c.itens.flatMap((it) => it.talhoes));
          const area = ctx.talhoes.filter((t) => talhoes.has(t.nome)).reduce((s, t) => s + t.area, 0);
          const nOps = c.itens.length;
          return `
            ${i ? `<span class="cal-info__seta" aria-hidden="true">${Icones.proxima}</span>` : ''}
            <section class="cal-fase" role="listitem" aria-label="${esc(`${titulo} ${sub}`)}">
              <header class="cal-fase__titulo" style="background: ${cor}">
                <span class="cal-fase__nome">${esc(titulo)}</span>${sub ? `<span class="cal-fase__dap">(${esc(sub)})</span>` : ''}
              </header>
              <img class="cal-fase__desenho cal-fase__imagem" src="${imagem}" alt="">
              <div class="cal-fase__itens">${c.itens.map(cartao).join('')}</div>
              <footer class="cal-fase__pe">${Icones.mapa}<span><strong>${Util.area(area)}</strong> · ${talhoes.size} ${talhoes.size === 1 ? 'talhão' : 'talhões'} · ${nOps} ${nOps === 1 ? 'operação' : 'operações'}</span></footer>
            </section>`;
        }).join('')}
      </div>`;
  }

  function tabela(ctx, lista, total) {
    const { somenteLeitura } = ctx;
    // Uma coluna por produto, na ordem em que aparecem no calendário
    const produtos = [];
    lista.forEach((it) => it.produtos.forEach(([chave, p]) => { if (!produtos.some((x) => x.chave === chave)) produtos.push({ chave, nome: p.nome }); }));
    return `
      <div class="cal-tabela talhoes-rolagem">
        <table class="tabela tabela--compacta tabela-talhoes cal-tabela__tabela">
          <thead><tr>
            <th class="tabela__numero">DAP</th><th>Fenologia</th><th>Grupo de operação</th><th>Operação</th><th>Prazo para encerramento da OS</th>
            <th class="tabela__numero">Talhões</th><th class="tabela__numero">Área (ha)</th>
            ${produtos.map((p) => `<th class="tabela__numero">${esc(p.nome)}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${lista.map((it) => {
              const idPrazo = it.colheita ? 'colheita' : it.op.id;
              const prazo = somenteLeitura ? `${it.prazo} ${it.prazo === 1 ? 'dia' : 'dias'}` : `
                <span class="cal-prazo"><input class="campo__controle cal-prazo__campo" type="text" inputmode="numeric" data-campo="cal-prazo"
                       data-op="${idPrazo}" value="${it.prazo}" aria-label="Prazo para encerramento da OS de ${esc(it.colheita ? 'Colheita' : it.op.nome)}, em dias"> dias</span>`;
              const dap = it.aguardando ? 'pelo ciclo' : it.colheita && it.dapMax !== it.dap ? `${it.dap} a ${it.dapMax}` : it.dap ?? '—';
              return `
                <tr>
                  <td class="tabela__numero">${dap}</td>
                  <td>${esc(it.fenologia || '—')}</td>
                  <td>${esc(it.grupo.nome)}</td>
                  <th scope="row" class="cal-tabela__op">${esc(it.colheita ? 'Colheita' : it.op.nome)}</th>
                  <td>${prazo}</td>
                  <td class="tabela__numero">${it.talhoes.length}/${total}</td>
                  <td class="tabela__numero">${Util.area(it.area).replace(' ha', '')}</td>
                  ${produtos.map((p) => {
                    const achado = it.produtos.find(([c]) => c === p.chave);
                    if (!achado) return '<td class="tabela__numero tabela__nao-recebe">—</td>';
                    const d = dose(achado[1], it.grupo);
                    return `<td class="tabela__numero" ${d.detalhe ? `title="${esc(d.detalhe)}"` : ''}>${esc(d.texto)}</td>`;
                  }).join('')}
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // ----- Eventos (repassados pela Tela 04). Devolvem true quando o evento era daqui. -----
  function aoClicar(e, ctx, { redesenhar }) {
    const alvo = e.target.closest('[data-acao="cal-visao"]');
    if (!alvo) return false;
    ctx.estado.visao = alvo.dataset.visao;
    redesenhar(`[data-visao="${alvo.dataset.visao}"]`);
    return true;
  }

  function aoMudar(e, ctx, { redesenhar, alterou }) {
    const campo = e.target.dataset.campo;
    if (campo === 'cal-talhao') { ctx.estado.talhao = e.target.value; redesenhar('[data-campo="cal-talhao"]'); return true; }
    if (campo === 'cal-prazo') {
      const n = Math.round(Util.numero(e.target.value));
      const id = e.target.dataset.op;
      const plantio = (ctx.plano.grupos.find((g) => g.tipo === 'Sementes') || { operacoes: [] }).operacoes[0];
      const op = id === 'colheita' ? null : ctx.plano.grupos.flatMap((g) => g.operacoes).find((o) => o.id === id);
      if (n > 0) {
        const opColheita = (ctx.plano.grupos.find((g) => g.tipo === 'Colheita') || { operacoes: [] }).operacoes[0];
        if (id === 'colheita' && opColheita) opColheita.prazo = n;
        else if (id === 'colheita' && plantio) plantio.prazoColheita = n; else if (op) op.prazo = n;
        alterou();
      }
      redesenhar(null);
      return true;
    }
    return false;
  }

  return { desenhar, aoClicar, aoMudar, prazoDe };
})();

</script>
  <script>
/*
 * Tela 04.0 — Operações do plano (docs/telas/04.0-operacoes.md)
 * Etapa 1 do plano: as operações vindas do modelo, numa tabela por fase da cultura (Pré-plantio, Plantio,
 * Manejo da cultura, Colheita), para revisar antes do planejamento talhão a talhão. A fase vem do DAP.
 * Desenhada dentro da Tela 04 (mesmo cabeçalho do plano); a Tela 04 repassa os eventos para cá.
 */
window.Telas = window.Telas || {};

window.Telas.operacoesPlano = (function () {
  const esc = Util.escapar;

  // Faixas na ordem em que as coisas acontecem; dapNovo = DAP sugerido para a operação adicionada na faixa
  const FASES = [
    { id: 'pre', nome: 'Pré-plantio', dapNovo: -1 },
    { id: 'plantio', nome: 'Plantio', dapNovo: 0 },
    { id: 'desenv', nome: 'Manejo da cultura', dapNovo: 1 },
    { id: 'colheita', nome: 'Colheita', dapNovo: null }
  ];

  // Plantio (grupo Sementes) e Colheita: operação fixa (não troca de grupo, não se exclui)
  const fixo = (g) => g.tipo === 'Sementes' || g.tipo === 'Colheita';
  // "Sem grupo": onde ficam as operações de um grupo excluído, até o usuário escolher o grupo de cada uma.
  // Não é um grupo de verdade: não aparece na lista de grupos nem nas guias do Planejamento.
  const semGrupo = (g) => !!g.semGrupo;
  const gruposEscolhiveis = (plano) => plano.grupos.filter((x) => !fixo(x) && !semGrupo(x));

  // Fase pelo DAP: negativo = Pré-plantio; 0 = Plantio; positivo (ou sem DAP) = Manejo da cultura; grupo Colheita = Colheita
  function faseDe(g, op) {
    if (g.tipo === 'Colheita') return 'colheita';
    if (g.tipo === 'Sementes') return 'plantio';
    // Sem DAP (linha limpa): fica na fase em que estava até receber um DAP
    if (op.dap === null || op.dap === undefined || op.dap === '') return op.faseSemDap || 'desenv';
    return op.dap < 0 ? 'pre' : op.dap === 0 ? 'plantio' : 'desenv';
  }

  // Ícone de cada tipo de grupo (na coluna Grupo de operação)
  const ICONE_TIPO = {
    'Sementes': '<svg viewBox="0 0 24 24" class="tab-op__ico" style="color:#d9822b" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8" transform="rotate(30 12 12)" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    'Tratamento de sementes': '<svg viewBox="0 0 24 24" class="tab-op__ico" style="color:#b0682f" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8" transform="rotate(30 12 12)" fill="currentColor"/><path d="M9 15c2-1 4-4 5-7" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
    'Defensivos': '<svg viewBox="0 0 24 24" class="tab-op__ico" style="color:#2a64a8" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    'Fertilidade': '<svg viewBox="0 0 24 24" class="tab-op__ico" style="color:#3c8d2f" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z" fill="currentColor"/><path d="M5 19l8-8" stroke="#fff" stroke-width="1.6"/></svg>',
    'Colheita': '<svg viewBox="0 0 24 24" class="tab-op__ico" style="color:#b8860b" aria-hidden="true"><path d="M12 21V8M12 8c-3 0-4-2-4-4 3 0 4 2 4 4zm0 0c3 0 4-2 4-4-3 0-4 2-4 4zm0 5c-3 0-4-2-4-4 3 0 4 2 4 4zm0 0c3 0 4-2 4-4-3 0-4 2-4 4z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'
  };
  const iconeFase = (id) => (id === 'colheita' ? ICONE_TIPO.Colheita : Icones.broto);

  // ----- Desenho -----
  function desenhar(ctx) {
    const { plano } = ctx;
    const porFase = {};
    FASES.forEach((f) => { porFase[f.id] = []; });
    plano.grupos.forEach((g) => g.operacoes.forEach((op) => porFase[faseDe(g, op)].push({ g, op })));
    const ler = ctx.somenteLeitura;
    return `
      <section class="estrutura">
        ${ctx.estado.avisoFechado ? '' : `
          <div class="estrutura__aviso" role="note">${Icones.info}
            <p><strong>Revise as operações cadastradas.</strong> Cada operação vira uma Ordem de Serviço (OS) quando o plano for aprovado. Se estiver tudo certo, siga para o planejamento.</p>
            <button class="botao-icone estrutura__fechar" type="button" data-acao="est-fechar-aviso" aria-label="Fechar o aviso" title="Fechar">${Icones.fechar}</button>
          </div>`}
        <div class="tab-op__caixa">
          <table class="tab-op">
            <colgroup>
              <col class="tab-op__c-fase"><col class="tab-op__c-dap"><col class="tab-op__c-fen"><col class="tab-op__c-op"><col class="tab-op__c-grupo"><col class="tab-op__c-prazo">
              ${ler ? '' : '<col class="tab-op__c-acao">'}
            </colgroup>
            <thead><tr>
              <th class="tab-op__fase-cab"><span class="so-leitor">Fase</span></th>
              <th class="tab-op__dap">DAP</th><th>Fenologia</th><th>Operação</th><th>Grupo de operação</th><th>Previsão de conclusão</th>
              ${ler ? '' : '<th class="tab-op__acao"><span class="so-leitor">Ações</span></th>'}
            </tr></thead>
            ${FASES.map((f) => faixa(f, porFase[f.id], ctx)).join('')}
          </table>
        </div>
        ${ler ? '' : '<p class="tab-op__dica">Botão direito numa linha (ou ⋯ no fim dela): Inserir · Excluir · Limpar conteúdo.</p>'}
      </section>`;
  }

  // Cada fase: a faixa vertical à esquerda (nome deitado, na cor da fase, como no Calendário) ocupa todas as linhas da fase
  function faixa(f, itens, ctx) {
    const colunas = ctx.somenteLeitura ? 5 : 6;
    const n = itens.length;
    const linhas = [...itens].sort((a, b) => (a.op.dap ?? Infinity) - (b.op.dap ?? Infinity));
    const fase = `
      <th class="tab-op__fase-v tab-op__fase-v--${f.id}" rowspan="${Math.max(n, 1)}" scope="rowgroup"
          title="${f.nome}: ${n} ${n === 1 ? 'operação' : 'operações'}${f.id === 'colheita' ? ' · a data vem do plantio + ciclo da variedade' : ''}">
        <div class="tab-op__fase-v-conteudo"><span class="tab-op__fase-v-nome">${f.nome}</span></div>
      </th>`;
    if (!n) {
      return `
        <tbody class="tab-op__grupo-fase">
          <tr data-est-fase-vazia="${f.id}">${fase}
            <td colspan="${colunas}" class="tab-op__vazio">Nenhuma operação nesta fase.${ctx.somenteLeitura ? ''
              : ` <button class="link-acao" type="button" data-acao="est-nova-op" data-fase="${f.id}">${Icones.mais} Inserir operação</button>`}</td>
          </tr>
        </tbody>`;
    }
    return `
      <tbody class="tab-op__grupo-fase">
        ${linhas.map(({ g, op }, i) => linha(g, op, f.id, ctx, i === 0 ? fase : '')).join('')}
      </tbody>`;
  }

  function linha(g, op, fase, ctx, celulaFase) {
    const { somenteLeitura, estado, plano } = ctx;
    const nomeTexto = op.nome || 'Sem operação';
    // DAP: Plantio sempre 0; Colheita pelo ciclo da variedade; demais editáveis
    const dap = g.tipo === 'Sementes' ? '<span class="tab-op__fixo" title="O plantio é sempre o DAP 0">0</span>'
      : g.tipo === 'Colheita' ? '<span class="tab-op__fixo" title="Data de plantio + ciclo da variedade, talhão a talhão">Pelo ciclo</span>'
        : somenteLeitura ? `${op.dap ?? '—'}`
          : `<input class="campo__controle tab-op__num" type="text" inputmode="numeric" data-campo="est-dap" data-op="${op.id}"
                    value="${op.dap ?? ''}" placeholder="—" aria-label="DAP de ${esc(nomeTexto)}">`;
    // Fenologia: só no Manejo da cultura (Pré-plantio, Plantio e Colheita não têm fenologia)
    const fenologia = fase !== 'desenv' ? '<span class="tab-op__fixo" title="Sem fenologia nesta fase">—</span>'
      : somenteLeitura ? `<span class="tab-op__fixo">${esc(op.fenologia || '—')}</span>`
        : `<select class="campo__controle tab-op__fen" data-campo="est-fenologia" data-op="${op.id}" aria-label="Fenologia de ${esc(nomeTexto)}">
             <option value="">—</option>
             ${DADOS.fenologia.map((f) => `<option ${f === op.fenologia ? 'selected' : ''}>${f}</option>`).join('')}
           </select>`;
    // Nome: texto; dois cliques (ou F2) para renomear. Linha limpa ou nova: "Sem operação", em cinza
    const nome = estado.renomeandoOp === op.id
      ? `<input class="campo__controle tab-op__campo" data-campo="est-nome-op" data-op="${op.id}" value="${esc(op.nome)}"
                placeholder="Nome da operação" aria-label="Nome da operação" data-foco-inicial>`
      : somenteLeitura ? esc(nomeTexto)
        : `<span class="tab-op__nome ${op.nome ? '' : 'tab-op__nome--vazio'}" tabindex="0" data-est-renomear-op="${op.id}" title="Clique duas vezes para renomear">${esc(nomeTexto)}</span>`;
    // Grupo: Plantio e Colheita fixos; as demais escolhem entre os grupos (ou criam um novo)
    const grupo = semGrupo(g) ? (somenteLeitura ? '<span class="tab-op__grupo tab-op__sem-grupo">Sem grupo de operação</span>' : `
      <span class="tab-op__grupo tab-op__sem-grupo">${Icones.alerta}
        <select class="campo__controle tab-op__sel-grupo tab-op__sel-grupo--vazio" data-campo="est-grupo" data-op="${op.id}" aria-label="Grupo de operação de ${esc(nomeTexto)}: sem grupo">
          <option value="${g.id}" selected disabled>Sem grupo de operação</option>
          ${gruposEscolhiveis(plano).map((x) => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}
          <option disabled>──────────</option>
          <option value="__novo__">+ Novo grupo de operação</option>
        </select></span>`)
      : fixo(g) || somenteLeitura
      ? `<span class="tab-op__grupo">${ICONE_TIPO[g.tipo] || ''}${somenteLeitura ? esc(g.nome)
          : `<span class="tab-op__grupo-nome" tabindex="0" data-est-renomear-grupo="${g.id}" title="Clique duas vezes para renomear o grupo">${esc(g.nome)}</span>`}</span>`
      : `<span class="tab-op__grupo">${ICONE_TIPO[g.tipo] || ''}
           <select class="campo__controle tab-op__sel-grupo" data-campo="est-grupo" data-op="${op.id}" aria-label="Grupo de operação de ${esc(nomeTexto)}">
             ${gruposEscolhiveis(plano).map((x) => `<option value="${x.id}" ${x === g ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}
             <option disabled>──────────</option>
             <option value="__novo__">+ Novo grupo de operação</option>
             <option value="__renomear__">✎ Renomear “${esc(g.nome)}”…</option>
             <option value="__excluir__">🗑 Excluir grupo “${esc(g.nome)}”…</option>
           </select></span>`;
    const prazo = Telas.calendario.prazoDe(op, g);
    const previsao = somenteLeitura ? `${prazo} ${prazo === 1 ? 'dia' : 'dias'}` : `
      <span class="tab-op__prazo"><input class="campo__controle tab-op__num" type="text" inputmode="numeric" data-campo="est-prazo"
             data-op="${op.id}" value="${prazo}" aria-label="Previsão de conclusão de ${esc(nomeTexto)}, em dias"> dias</span>`;
    // Ações da linha: botão direito na linha ou "⋯" (aparece ao passar o mouse; a Colheita não tem menu)
    const temMenu = !somenteLeitura && g.tipo !== 'Colheita';
    return `
      <tr ${temMenu ? `data-est-linha="${op.id}"` : ''}>
        ${celulaFase}
        <td class="tab-op__dap">${dap}</td>
        <td>${fenologia}</td>
        <td class="tab-op__op">${nome}</td>
        <td>${grupo}</td>
        <td>${previsao}</td>
        ${somenteLeitura ? '' : `<td class="tab-op__acao">${temMenu ? `
          <button class="botao-icone tab-op__mais" type="button" data-acao="est-menu" data-op="${op.id}"
                  title="Inserir, excluir ou limpar a linha" aria-label="Ações da linha ${esc(nomeTexto)}">⋯</button>` : ''}</td>`}
      </tr>`;
  }

  // ----- Ações -----
  function acharOp(plano, id) {
    for (const g of plano.grupos) {
      const op = g.operacoes.find((o) => o.id === id);
      if (op) return { g, op };
    }
    return null;
  }

  // Grupo que fica sem nenhuma operação some do plano (e das guias do Planejamento); Semente e Colheita ficam.
  // Devolve a posição do grupo removido (para o Desfazer), ou -1.
  function removerSeVazio(plano, g) {
    if (g.operacoes.length || fixo(g)) return -1;
    const i = plano.grupos.indexOf(g);
    plano.grupos.splice(i, 1);
    return i;
  }

  // Adicionar operação na faixa: entra no primeiro grupo que recebe operações (troca na coluna Grupo),
  // com o DAP da fase, e já abre o nome para editar
  // "Sem grupo" do plano (cria antes da Colheita, se ainda não existe)
  function semGrupoDoPlano(plano) {
    let sg = plano.grupos.find(semGrupo);
    if (!sg) {
      sg = { ...Planos.novoGrupo('Sem grupo', ''), semGrupo: true };
      const iColheita = plano.grupos.findIndex((g) => g.tipo === 'Colheita');
      plano.grupos.splice(iColheita >= 0 ? iColheita : plano.grupos.length, 0, sg);
    }
    return sg;
  }

  // Linha nova (Inserir): sem nome e sem grupo, como uma linha limpa; já abre o nome para digitar
  function criarLinha(dap, ctx, acoes) {
    const op = Planos.novaOperacao('', dap);
    semGrupoDoPlano(ctx.plano).operacoes.push(op);
    ctx.estado.renomeandoOp = op.id;
    acoes.alterou(); acoes.redesenhar(null);
  }

  // Inserir numa fase vazia: com o DAP da fase
  function novaOperacao(fase, ctx, acoes) {
    criarLinha(FASES.find((x) => x.id === fase).dapNovo, ctx, acoes);
  }

  // Excluir operação: com talhões planejados, confirma com o impacto; depois, Desfazer (volta o grupo, se tinha sumido)
  function excluirOperacao(id, ctx, acoes) {
    const { plano } = ctx;
    const achado = acharOp(plano, id);
    if (!achado) return;
    const { g, op } = achado;
    const remover = () => {
      const i = g.operacoes.indexOf(op);
      g.operacoes.splice(i, 1);
      const ig = removerSeVazio(plano, g);
      acoes.alterou(); acoes.redesenhar(null);
      Aviso.mostrar(`${esc(op.nome)} excluída${ig >= 0 ? ` (o grupo ${esc(g.nome)} ficou vazio e saiu do plano)` : ''}`, { acao: 'Desfazer', aoAgir: () => {
        if (ig >= 0) plano.grupos.splice(ig, 0, g);
        g.operacoes.splice(i, 0, op);
        acoes.alterou(); acoes.redesenhar(null);
      } });
    };
    const talhoes = Object.keys(op.talhoes || {}).length + Object.keys(op.plantio || {}).length;
    if (!talhoes) { remover(); return; }
    Modal.confirmar({
      titulo: `Excluir ${esc(op.nome)}?`,
      texto: `Ela já está planejada em ${talhoes} ${talhoes === 1 ? 'talhão' : 'talhões'}; esse planejamento também será apagado.`,
      botoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Excluir operação', classe: 'perigo', acao: remover }]
    });
  }

  // Trocar o grupo da operação (ou criar um grupo novo para ela); o grupo de origem que ficar vazio some
  function moverParaGrupo(op, origem, destino, ctx, acoes) {
