<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Safra · UniSystem</title>
  <link rel="icon" type="image/png" href="img/icone-unisystem.png">
  <!-- Leaflet (mapa da visão Mapa do grupo Semente) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="app">
    <!-- Menu lateral -->
    <aside class="menu" id="menu">
      <div class="menu__topo">
        <img class="menu__logo" src="img/icone-unisystem.png" alt="UniSystem">
        <span class="menu__marca">UniSystem</span>
      </div>

      <nav class="menu__nav" aria-label="Menu principal">
        <!-- Plano de Safra: três itens (Visão Geral, Planejamento, Orçamento) -->
        <div class="menu__grupo">
          <a class="menu__item menu__pai" href="#/plano-safra" title="Plano de Safra">
            <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
              <!-- Plano: folha de papel com um broto no topo e as linhas do texto -->
              <rect x="4.5" y="2.5" width="15" height="19" rx="1.5"/>
              <path d="M12 10.5V7.8M12 7.8c0-1.8-1.1-2.9-3-2.9 0 1.8 1.1 2.9 3 2.9ZM12 7.8c0-1.8 1.1-2.9 3-2.9 0 1.8-1.1 2.9-3 2.9Z"/>
              <path d="M8 13h8M8 15.6h8M8 18.2h5"/>
            </svg>
            <span class="menu__texto">Plano de Safra</span>
          </a>
          <!-- Setinha: abre e fecha a lista do grupo (o nome continua levando à Visão Geral) -->
          <button class="menu__grupo-alternar" type="button" data-grupo="Plano de Safra"
                  aria-controls="menu-subitens" aria-expanded="true" title="Minimizar Plano de Safra">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu__subitens" id="menu-subitens">
            <a class="menu__item menu__sub" href="#/plano-safra" data-rota="visao-geral" title="Visão Geral">
              <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
              </svg>
              <span class="menu__texto">Visão Geral</span>
            </a>
            <a class="menu__item menu__sub" href="#/planejamento" data-rota="planejamento" title="Planejamento">
              <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/><path d="M9 17h6"/>
              </svg>
              <span class="menu__texto">Planejamento</span>
            </a>
            <a class="menu__item menu__sub" href="#/orcamento" data-rota="orcamento" title="Orçamento">
              <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5V8M12 16v1.5"/>
              </svg>
              <span class="menu__texto">Orçamento</span>
            </a>
          </div>
        </div>
        <!-- Gestão da Lavoura: Planejado x Executado e Central OS (o nome leva ao Planejado x Executado, na guia Calendário Agrícola) -->
        <div class="menu__grupo">
          <a class="menu__item menu__pai" href="#/calendario-agricola" title="Gestão da Lavoura">
            <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
              <!-- Lavoura: o broto (antes o ícone do Plano de Safra) -->
              <path d="M12 21v-9"/>
              <path d="M12 12c0-4 2.5-6.5 7-6.5 0 4.5-2.5 6.5-7 6.5Z"/>
              <path d="M12 14c0-3.5-2.2-5.5-6.5-5.5 0 3.8 2.2 5.5 6.5 5.5Z"/>
            </svg>
            <span class="menu__texto">Gestão da Lavoura</span>
          </a>
          <button class="menu__grupo-alternar" type="button" data-grupo="Gestão da Lavoura"
                  aria-controls="menu-subitens-lavoura" aria-expanded="true" title="Minimizar Gestão da Lavoura">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu__subitens" id="menu-subitens-lavoura">
            <a class="menu__item menu__sub" href="#/calendario-agricola" data-rota="planejado-executado" title="Planejado x Executado">
              <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
                <!-- Trator -->
                <circle cx="7" cy="16.5" r="3"/><circle cx="18" cy="17.5" r="2"/>
                <path d="M4.5 14V8h6.5l2 6"/><path d="M10 16.5h6M13 14h6.5l.5 1.5"/><path d="M15.5 14V9.5h3M7 8V5"/>
              </svg>
              <span class="menu__texto">Planejado x Executado</span>
            </a>
            <a class="menu__item menu__sub" href="#/central-os" data-rota="central-os" title="Central OS">
              <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
                <!-- Documento -->
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>
              </svg>
              <span class="menu__texto">Central OS</span>
            </a>
          </div>
        </div>
        <a class="menu__item" href="#/cadastros" data-rota="cadastros" title="Cadastros">
          <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
            <!-- Editar: lápis sobre um quadro aberto -->
            <path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
            <path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-3.8 1 1-3.8Z"/>
          </svg>
          <span class="menu__texto">Cadastros</span>
        </a>
      </nav>

      <button class="menu__alternar" id="menu-alternar" type="button"
              aria-controls="menu" aria-expanded="true" title="Recolher menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>

      <div class="menu__rodape">
        <!-- Usuário: abre o menu do usuário (Configurações › Aparência e Sair) -->
        <div class="usuario">
          <div class="usuario__opcoes" id="usuario-opcoes" role="menu" aria-label="Menu do usuário" hidden>
            <button class="usuario__opcao" type="button" role="menuitem" data-usuario="configuracoes">
              <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
              </svg>
              Configurações
            </button>
            <button class="usuario__opcao" type="button" role="menuitem" data-usuario="sair">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              Sair
            </button>
          </div>
          <button class="menu__usuario" id="menu-usuario" type="button" title="Menu do usuário"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="usuario-opcoes">
            <!-- preenchido por js/app.js a partir de js/dados-exemplo.js -->
          </button>
        </div>
      </div>
    </aside>

    <!-- Área de conteúdo: cada tela é desenhada aqui -->
    <main class="conteudo" id="conteudo"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- SheetJS: exportar e importar o plano em .xlsx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/dados-exemplo.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/planos.js"></script>
  <script src="js/versoes.js"></script>
  <script src="js/arquivo-plano.js"></script>
  <script src="js/telas/em-construcao.js"></script>
  <script src="js/telas/sem-planos.js"></script>
  <script src="js/telas/01-primeiro-uso.js"></script>
  <script src="js/telas/02-modal-criar-plano.js"></script>
  <script src="js/telas/03-painel.js"></script>
  <script src="js/telas/03-lista-planos.js"></script>
  <script src="js/telas/05-calendario.js"></script>
  <script src="js/telas/calendario-agricola.js"></script>
  <script src="js/telas/gestao-lavoura.js"></script>
  <script src="js/telas/central-corp.js"></script>
  <script src="js/telas/os-calendario.js"></script>
  <script src="js/telas/monitoramento-aplicacoes.js"></script>
  <script src="js/telas/orcamento.js"></script>
  <script src="js/telas/04.0-operacoes-plano.js"></script>
  <script src="js/telas/inicio-plano.js"></script>
  <script src="js/telas/04-operacoes.js"></script>
  <script src="js/configuracoes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
