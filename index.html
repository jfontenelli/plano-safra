<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Safra · UniSystem</title>
  <link rel="icon" type="image/png" href="img/icone-unisystem.png">
  <!-- Leaflet (mapa da visão Mapa do grupo Semente) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="app">
    <!-- Menu lateral -->
    <aside class="menu" id="menu">
      <div class="menu__topo">
        <img class="menu__logo" src="img/icone-unisystem.png" alt="UniSystem">
        <span class="menu__marca">UniSystem</span>
      </div>

      <nav class="menu__nav" aria-label="Menu principal">
        <a class="menu__item" href="#/plano-safra" data-rota="plano-safra" title="Plano de Safra">
          <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21v-9"/>
            <path d="M12 12c0-4 2.5-6.5 7-6.5 0 4.5-2.5 6.5-7 6.5Z"/>
            <path d="M12 14c0-3.5-2.2-5.5-6.5-5.5 0 3.8 2.2 5.5 6.5 5.5Z"/>
          </svg>
          <span class="menu__texto">Plano de Safra</span>
        </a>
        <a class="menu__item" href="#/ordens-servico" data-rota="ordens-servico" title="Ordens de Serviço">
          <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="14" height="17" rx="2"/>
            <path d="M9 4V3h6v1"/>
            <path d="M9 10h6M9 14h6M9 18h3"/>
          </svg>
          <span class="menu__texto">Ordens de Serviço</span>
        </a>
        <a class="menu__item" href="#/cadastros" data-rota="cadastros" title="Cadastros">
          <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
            <path d="M14 3v5h5"/>
            <path d="M9 12h6M9 16h6"/>
          </svg>
          <span class="menu__texto">Cadastros</span>
        </a>
      </nav>

      <button class="menu__alternar" id="menu-alternar" type="button"
              aria-controls="menu" aria-expanded="true" title="Recolher menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>

      <div class="menu__rodape">
        <!-- Demonstração: troca entre começar sem planos e ver os planos de exemplo -->
        <div class="demo">
          <button class="menu__item demo__botao" id="demo-botao" type="button" title="Demonstração"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="demo-opcoes">
            <svg class="menu__icone" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2"/>
              <path d="M10 8l4 2-4 2Z"/>
              <path d="M8 20h8M12 16v4"/>
            </svg>
            <span class="menu__texto">Demonstração</span>
          </button>
          <div class="demo__opcoes" id="demo-opcoes" role="menu" aria-label="Demonstração" hidden>
            <p class="demo__titulo">Demonstração</p>
            <button class="demo__opcao" type="button" role="menuitem" data-demo="zero">
              <span class="demo__opcao-titulo">Começar do zero</span>
              <span class="demo__opcao-texto">Sem planos cadastrados, a partir do primeiro uso.</span>
            </button>
            <button class="demo__opcao" type="button" role="menuitem" data-demo="exemplo">
              <span class="demo__opcao-titulo">Ver com planos de exemplo</span>
              <span class="demo__opcao-texto">Plano de soja 26/27 em duas fazendas: um em construção e um aprovado.</span>
            </button>
          </div>
        </div>

        <div class="menu__usuario" id="menu-usuario">
          <!-- preenchido por js/app.js a partir de js/dados-exemplo.js -->
        </div>
      </div>
    </aside>

    <!-- Área de conteúdo: cada tela é desenhada aqui -->
    <main class="conteudo" id="conteudo"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- SheetJS: exportar e importar o plano em .xlsx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/dados-exemplo.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/planos.js"></script>
  <script src="js/arquivo-plano.js"></script>
  <script src="js/telas/em-construcao.js"></script>
  <script src="js/telas/01-primeiro-uso.js"></script>
  <script src="js/telas/02-modal-criar-plano.js"></script>
  <script src="js/telas/03-lista-planos.js"></script>
  <script src="js/telas/04-operacoes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
